<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frying Pan's Friends Hardest Created Levels List</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <div class="header-left">
            <h1>Frying Pan's Friends</h1>
            <p>Hardest Created Levels List</p>
        </div>

        <nav>
            <button class="nav-button active">List</button>
            <button class="nav-button">Leaderboard</button>
            <button class="nav-button">Roulette</button>
        </nav>
    </header>

    <main>
        <section class="level-list">
            <h2>Levels</h2>

        <section class="level-info">

    <footer>
        <p>Frying Pan's Friends Hardest Created Levels List</p>
        <p>Website version 1.0.0</p>
    </footer>

    <script src="./script.js"></script>

</html>
