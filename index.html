<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frying Pan's Friends</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="header">
        <div>
            <h1>Frying Pan's Friends</h1>
            <p>Hardest Created Levels List</p>
        </div>

        <nav>
            <button class="nav-button active">List</button>
            <button class="nav-button">Leaderboard</button>
            <button class="nav-button">Roulette</button>
        </nav>
    </header>

    <main>
        <section class="list-panel">
            <h2>Levels</h2>
            <div id="level-list"></div>
        </section>

        <section class="details-panel">
            <div id="level-details">
                <h2>Loading...</h2>
            </div>
        </section>
    </main>

    <footer>
        Frying Pan's Friends Hardest Created Levels List
    </footer>

    <script src="./script.js"></script>
</body>
</html>
